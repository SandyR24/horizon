
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HORIZON - Mes activités</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f2f6fa;
      margin: 0;
      color: #193c60;
    }

    header {
      background: #235c91;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 { margin: 0 0 8px; }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 15px;
    }

    .centres {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 22px;
      align-items: start;
    }

    .anciens {
      display: grid;
      gap: 20px;
    }

    .centre {
      background: white;
      border-radius: 15px;
      padding: 22px;
      box-shadow: 0 2px 10px #dce3ea;
    }

    .centre h2 {
      margin-top: 0;
      text-align: center;
    }

    .nouveau {
      border: 2px solid #26966f;
    }

    .badge {
      display: block;
      width: fit-content;
      margin: 0 auto 15px;
      padding: 7px 14px;
      background: #dff4e9;
      color: #18734e;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
    }

    .activite {
      display: block;
      padding: 17px;
      margin: 12px 0;
      background: #edf4fb;
      color: #193c60;
      text-decoration: none;
      border-radius: 9px;
      font-weight: bold;
      text-align: center;
    }

    .activite:hover,
    .activite:focus {
      background: #d5e8fa;
      outline: 2px solid #235c91;
    }

    .nouveau .activite {
      background: #e5f5ec;
    }

    .nouveau .activite:hover,
    .nouveau .activite:focus {
      background: #c9ead8;
    }

    @media (max-width: 700px) {
      .centres {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>HORIZON</h1>
  <p>Mon espace d'activités</p>
</header>

<main>
  <div class="centres">

    <section class="centre nouveau">
      <span class="badge">Cette semaine</span>
      <h2>ACTIVITÉS CENTRE 10</h2>

      <a class="activite"
         href="https://wordwall.net/play/72519/084/921?wwmethod=link"
         target="_blank" rel="noopener noreferrer">
        Activité 1
      </a>

      <a class="activite"
         href="https://wordwall.net/play/106739/960/664?wwmethod=link"
         target="_blank" rel="noopener noreferrer">

         href="https://wordwall.net/play/68965/314/269?wwmethod=link"
         target="_blank" rel="noopener noreferrer">

      </a>

      <a class="activite"
         href="https://wordwall.net/play/37265/370/619?wwmethod=link"
         target="_blank" rel="noopener noreferrer">
        Activité 4
      </a>
    </section>

    <div class="anciens">

      <section class="centre">
        <h2>ACTIVITÉS CENTRE 9</h2>

        <a class="activite"

           href="https://wordwall.net/play/63742/679/868?wwmethod=link"

      </section>

      <section class="centre">

        <a class="activite"

  </div>
</main>

</body>
</html>
